services:
  postgres:
    image: ${POSTGRES_IMAGE:?Run scripts/compose.sh with an immutable image digest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: calendar
      POSTGRES_USER: calendar
      POSTGRES_PASSWORD: ${CALENDAR_POSTGRES_PASSWORD:?Set CALENDAR_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendar -d calendar"]
      interval: 5s
      timeout: 3s
      retries: 20

  calendar-serve:
    image: ${CALENDAR_IMAGE:?Run scripts/compose.sh with an immutable image digest}
    command: ["serve"]
    restart: unless-stopped
    env_file: ${CALENDAR_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${CALENDAR_DATABASE_URL:-postgres://calendar:${CALENDAR_POSTGRES_PASSWORD:?Set CALENDAR_POSTGRES_PASSWORD}@postgres:5432/calendar?sslmode=disable}
      UI_TRUST_FORWARD_AUTH: "true"
      UI_ALLOW_UNAUTHENTICATED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  calendar-worker:
    image: ${CALENDAR_IMAGE:?Run scripts/compose.sh with an immutable image digest}
    command: ["worker"]
    restart: unless-stopped
    env_file: ${CALENDAR_ENV_FILE:-.env}
    environment:
      DATABASE_URL: ${CALENDAR_DATABASE_URL:-postgres://calendar:${CALENDAR_POSTGRES_PASSWORD:?Set CALENDAR_POSTGRES_PASSWORD}@postgres:5432/calendar?sslmode=disable}
    depends_on:
      calendar-serve:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/health"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
