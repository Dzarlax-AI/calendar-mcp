name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    name: Build & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci

      - name: Frontend typecheck
        run: npm --prefix frontend run typecheck

      - name: Frontend tests
        run: npm --prefix frontend test

      - name: Frontend production build
        run: npm --prefix frontend run build

      - name: Install Chromium for visual regression tests
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Frontend visual regression tests
        run: npm --prefix frontend run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage embedded frontend bundle
        run: |
          mkdir -p internal/web/spa/dist
          cp -R frontend/dist/. internal/web/spa/dist/

      - name: Verify Docker image build
        run: docker build --file Dockerfile --tag calendar-mcp:ci .

      - name: Test
        run: go test -race -count=1 ./...

      - name: Validate Compose examples
        env:
          CALENDAR_ENV_FILE: .env.example
          CALENDAR_IMAGE: ghcr.io/example/calendar@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          POSTGRES_IMAGE: postgres@sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          CALENDAR_POSTGRES_PASSWORD: test-password
        run: |
          ./scripts/compose.sh sqlite config --quiet
          ./scripts/compose.sh postgres config --quiet
          if CALENDAR_IMAGE=ghcr.io/example/calendar:latest ./scripts/compose.sh sqlite config --quiet; then
            echo "mutable calendar image unexpectedly passed validation" >&2
            exit 1
          fi

      - name: Build
        run: CGO_ENABLED=0 go build ./...

      - name: Vet
        run: CGO_ENABLED=0 go vet ./...

  docker:
    name: Docker Build & Push
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dzarlax-ai/calendar-mcp
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
